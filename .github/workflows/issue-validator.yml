name: Issue Log Validator

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  validate-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate console logs presence in bug reports
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = (issue.labels || []).map(l => l.name);
            const isBug = labels.includes('bug') || (issue.title && issue.title.startsWith('[Bug]'));

            if (!isBug) {
              return;
            }

            const body = issue.body || '';

            // Check if user attached a log file (.log or .txt) via GitHub file upload
            const hasLogAttachment = /\[[^\]]+\.(log|txt)\]\(https:\/\/github\.com\/[^\)]+\)/i.test(body);

            // Check if user pasted actual console log content with common OmniLaunch log tags
            const hasLogMarkers = /\[(menu|themeshop|gallery|steamgriddb|launcher|theme|system|pdm|debug|audio)\]/i.test(body) ||
                                  /=== (SwitchU|OmniLaunch) log (start|end) ===/i.test(body) ||
                                  /svcOutputDebugString/i.test(body);

            // Extract the logs section from the GitHub issue form
            const logSectionMatch = body.match(/### Logs do Console[^\n]*\n([\s\S]*?)(?=###|$)/i);
            const logSectionContent = logSectionMatch ? logSectionMatch[1].trim() : '';

            // Common non-answers or placeholder text
            const isPlaceholder = /^(none|nenhum|nao|não|nao sei|não sei|sem log|no log|paste logs here|cole os logs aqui|\.{3,}|n\/a|-)$/i.test(logSectionContent.trim());
            const hasSubstantialText = logSectionContent.length >= 60 && !isPlaceholder;

            const isValid = hasLogAttachment || hasLogMarkers || hasSubstantialText;

            if (!isValid) {
              const comment = `### ⚠️ Fechamento Automático: Logs Obrigatórios Ausentes / Automatic Closure: Missing Required Logs

Olá @${issue.user.login}!

Conforme as diretrizes do **OmniLaunch**, todo relato de bug **precisa obrigatoriamente incluir os logs do console**. Fotos, prints ou vídeos sozinhos não contêm as informações técnicas necessárias para identificar a causa raiz do problema.

Como nenhum log válido foi anexado ou informado no campo obrigatório, esta issue foi **fechada automaticamente**.

---

### 📂 Onde encontrar os logs no seu Nintendo Switch:
1. Conecte o cartão SD ao PC ou use DBI / FTP / MTP.
2. Copie o arquivo de log:
   - \`sdmc:/config/OmniLaunch/menu.log\` (log principal do menu)
   - \`sdmc:/config/OmniLaunch/log.txt\` (log do daemon/geral)
   - Em caso de crash com tela de erro do Atmosphere, anexe também o arquivo mais recente em \`sdmc:/atmosphere/crash_reports/\`.

---

### 🔄 Como reabrir esta issue:
Assim que você anexar o arquivo \`menu.log\` ou colar os logs nesta issue, basta clicar no botão **Reopen issue** logo abaixo para que possamos analisá-la e corrigi-la.

---

*(English summary)*: Bug reports without console logs (\`sdmc:/config/OmniLaunch/menu.log\`) are automatically closed. Please attach your log file and click **Reopen issue**.`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: comment
              });

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['needs-logs']
              });

              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'not_planned'
              });
            }
